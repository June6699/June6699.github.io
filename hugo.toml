# 主题放在 themes/PaperMod，不用 Hugo Module
# 生产构建（hugo / CI）用此 URL；本地预览请用 run_server.bat 或：hugo server --baseURL http://localhost:1313/
# 亦可设环境变量 HUGO_BASEURL（优先级更高）。
baseURL = "https://june6699.top/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
title = "June's Blog"
theme = "PaperMod"
googleAnalytics = "G-S7DXV0QV58"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[languages]
  [languages.zh]
    languageName = "中文"
    languageCode = "zh-cn"
    weight = 1

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^GITALK_']

# 排除：文章图目录、动态目录下的位图（仅作源文件，由 scripts/sync_images.py 复制到 static/images）
[build]
  ignoreFiles = [
    "content/posts/images",
    "content/posts/images/",
    "content/moments/.*\\.(?i)(png|jpg|jpeg|webp|gif|bmp|avif)$",
  ]
# 「未来日期」文章：默认 hugo 不会生成（见 hugo list future）。请在 hugo / hugo server 命令中加 --buildFuture，
# 已写入 run_server.bat 与 .github/workflows/hugo.yml。

# 允许正文中的 Raw HTML（诗词等 div/class）并屏蔽相关警告
[markup.goldmark.extensions.extras.mark]
  enable = true

[markup.goldmark.renderer]
  unsafe = true
ignoreLogs = ["warning-goldmark-raw-html"]

[params]
  description = "Who Changes? Who Benefits!"
  author = "June"
  comments = true
  ba_track_id = "6a0eceeee843ef6235b91843cc1a936e"
  homeHeroImage = "/images/header_img/header.jpg"
  homeHeroTitle = "June's Blog"
  homeHeroSubtitle = "Who Changes? Who Benefits!"
  sidebarAboutTitle = "关于我"
  sidebarAboutText = "徐子昂 · 研究生 · 生信/前端/杂记"
  sidebarAvatar = "/images/kara.png"
  sidebarEmail = "3439394104@qq.com"
  # 统计页「已运行天数」起始日（可改为建站/博客上线日）
  siteBirthDate = "2026-01-01"
  # 首页、归档等从 posts 取文章列表
  mainSections = ["posts"]
  # 文章页显示右侧目录，不显示「Table of Contents」标题，直接从一级标题列起以节省空间
  ShowToc = true
  TocOpen = false
  # 首页侧栏：隐藏标签卡（仅保留关于 + 下方快捷入口）
  sidebarHideTagsOnHome = true

[params.cover]
  # 首页/列表不展示文章封面图，仅标题与摘要
  hiddenInList = true

# Gitalk：clientID / clientSecret 仅通过环境变量注入（勿写入仓库）。
# 本地：set GITALK_CLIENT_ID=... & set GITALK_CLIENT_SECRET=...（PowerShell 用 $env:）
# CI：在仓库 Settings → Secrets 中配置 GITALK_CLIENT_ID、GITALK_CLIENT_SECRET
# 从仓库移除密钥后请在 GitHub OAuth App 中轮换 client secret。
[params.gitalk]
  enable = true
  # 与 Jekyll 版 _config.yml 一致；若仅本地使用可保留。推送到公开仓库前建议改用环境变量并轮换 OAuth secret。
  clientID = "Ov23lip1sLnFPYK622n1"
  clientSecret = "66b4d7a3fa6cf24bb721f85072a93fddc0d80229"
  repo = "June6699.github.io"
  owner = "June6699"
  admin = ["June6699"]
  distractionFreeMode = true

