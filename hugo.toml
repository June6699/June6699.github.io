# 主题放在 themes/PaperMod，不用 Hugo Module
baseURL = "https://June6699.github.io/"
languageCode = "zh-cn"
title = "June's Blog"
theme = "PaperMod"
googleAnalytics = "G-S7DXV0QV58"

# 排除 content/posts/images（junction），避免 Windows 下 read 报错
[build]
  ignoreFiles = ["content/posts/images", "content/posts/images/"]

# 允许正文中的 Raw HTML（诗词等 div/class）并屏蔽相关警告
[markup.goldmark.renderer]
  unsafe = true
ignoreLogs = ["warning-goldmark-raw-html"]

[params]
  description = "Who Changes? Who Benefits!"
  author = "June"
  comments = true
  ba_track_id = "6a0eceeee843ef6235b91843cc1a936e"
  homeHeroImage = "/images/header_img/header.jpg"
  homeHeroTitle = "June's Blog"
  homeHeroSubtitle = "Who Changes? Who Benefits!"
  sidebarAboutTitle = "关于我"
  sidebarAboutText = "徐子昂 · 研究生 · 生信/前端/杂记"
  sidebarAvatar = "/images/底特律·变包.png"
  sidebarEmail = "3439394104@qq.com"
  # 统计页「已运行天数」起始日（可改为建站/博客上线日）
  siteBirthDate = "2026-01-01"
  # 首页、归档等从 posts 取文章列表
  mainSections = ["posts"]
  # 文章页显示右侧目录，不显示「Table of Contents」标题，直接从一级标题列起以节省空间
  ShowToc = true
  TocOpen = false

[params.cover]
  # 首页/列表不展示文章封面图，仅标题与摘要
  hiddenInList = true

[params.gitalk]
  enable = true
  clientID = "Ov23lip1sLnFPYK622n1"
  clientSecret = "66b4d7a3fa6cf24bb721f85072a93fddc0d80229"
  repo = "June6699.github.io"
  owner = "June6699"
  admin = ["June6699"]
  distractionFreeMode = true

