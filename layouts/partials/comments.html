{{- /* giscus 评论（GitHub Discussions）：凭据全是公开标识（repo/category ID），无需任何 secret。
       客户端按视口惰性加载；主题跟随站点 data-theme，切换时经 postMessage 同步进 iframe。 */ -}}
<div class="giscus-wrap">
    <div id="giscus-container"></div>
</div>
<script>
    (function () {
        'use strict';

        var GISCUS_ORIGIN = 'https://giscus.app';
        var CONFIG = {
            'data-repo': 'June6699/June6699.github.io',
            'data-repo-id': 'R_kgDORpOPAA',
            'data-category': '文章评论',
            'data-category-id': 'DIC_kwDORpOPAM4DLNDU',
            'data-mapping': 'og:title',
            'data-strict': '1',
            'data-reactions-enabled': '1',
            'data-emit-metadata': '0',
            'data-input-position': 'bottom',
            'data-lang': 'zh-CN'
        };

        var container = document.getElementById('giscus-container');
        if (!container) return;

        /* giscus 主题值与站点 data-theme 一一对应 */
        function giscusTheme() {
            return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        }

        function load() {
            if (container.dataset.giscusReady === '1') return;
            container.dataset.giscusReady = '1';

            var s = document.createElement('script');
            s.src = GISCUS_ORIGIN + '/client.js';
            s.async = true;
            s.crossOrigin = 'anonymous';
            s.setAttribute('data-theme', giscusTheme());
            for (var key in CONFIG) s.setAttribute(key, CONFIG[key]);
            container.appendChild(s);
        }

        /* 评论区在首屏外：接近视口再加载，避免与首屏资源抢网络 */
        if ('IntersectionObserver' in window) {
            var observer = new IntersectionObserver(function (entries) {
                if (entries.some(function (entry) { return entry.isIntersecting; })) {
                    observer.disconnect();
                    load();
                }
            }, { rootMargin: '360px 0px' });
            observer.observe(container);
        } else if (window.requestIdleCallback) {
            requestIdleCallback(load, { timeout: 3000 });
        } else {
            window.addEventListener('load', function () { setTimeout(load, 0); });
        }

        /* 站点主题变化（顶栏切换 / 其他标签页 storage 同步）后推给 giscus iframe */
        new MutationObserver(function () {
            var frame = container.querySelector('iframe.giscus-frame');
            if (!frame) return;
            frame.contentWindow.postMessage(
                { giscus: { setConfig: { theme: giscusTheme() } } },
                GISCUS_ORIGIN
            );
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
</script>
