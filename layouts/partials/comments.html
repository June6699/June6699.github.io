{{- $gitalk := site.Params.gitalk -}}
{{- if and $gitalk $gitalk.enable -}}
<div id="gitalk-container"></div>
<script>
(function(){
  function loadCss(href){
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    document.head.appendChild(link);
  }

  function loadJs(src, cb){
    var s = document.createElement('script');
    s.async = true;
    s.src = src;
    s.onload = cb;
    document.body.appendChild(s);
  }

  function run(){
    loadCss('https://unpkg.com/gitalk/dist/gitalk.css');
    loadJs('https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js', function(){
      loadJs('https://unpkg.com/gitalk@latest/dist/gitalk.min.js', function(){
        var path = (location.pathname || '/');
        var id = (typeof md5 === 'function') ? md5(path) : path;
        var gitalk = new Gitalk({
          clientID: {{ $gitalk.clientID | jsonify }},
          clientSecret: {{ $gitalk.clientSecret | jsonify }},
          repo: {{ $gitalk.repo | jsonify }},
          owner: {{ $gitalk.owner | jsonify }},
          admin: {{ $gitalk.admin | jsonify }},
          distractionFreeMode: {{ $gitalk.distractionFreeMode | default true }},
          id: id
        });
        gitalk.render('gitalk-container');
      });
    });
  }

  if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 2000 });
  else window.addEventListener('load', function(){ setTimeout(run, 0); });
})();
</script>
{{- end -}}
